# Modified by Huaaudio for independent Bilibili/Discord development (2026).
/// START OF NEOMUSICBOT CONFIG ///
/////////////////////////////////////////////////////////
// NeoMusicBot runtime configuration                   //
// Commands are Discord Slash commands; prefix, alias, //
// lyrics, OAuth, and eval settings are not supported. //
/////////////////////////////////////////////////////////

// Prefer NEOMUSICBOT_DISCORD_TOKEN_FILE for production.
// NEOMUSICBOT_DISCORD_TOKEN is also supported. Do not configure more than one
// token source at a time.
token = BOT_TOKEN_HERE

// Discord user ID of the bot owner.
owner = 0 // OWNER ID

// Presence. Use DEFAULT for no activity, or values such as "Listening to music".
game = "DEFAULT"
status = ONLINE
// Show the current title when connected to at most one server's voice channel.
// Long titles are shortened for Discord's activity limit; missing titles restore game.
songinstatus = false

// Response symbols.
success = "🎶"
warning = "💡"
error = "🚫"


// Stay connected after the queue/default playlist is exhausted.
stayinchannel = false

// Maximum track duration in seconds; <= 0 disables the limit.
maxtime = 0

// youtube-source playlist page limit.
maxytplaylistpages = 10

// Fraction of listeners required for a vote skip: a finite number from 0 to 1.
// 0 allows any listener to skip; 1 requires all eligible listeners to vote.
skipratio = 0.55

// Seconds alone before disconnecting and clearing playback; <= 0 disables it.
alonetimeuntilstop = 0

// Local owner-managed playlists folder.
playlistsfolder = "Playlists"

// Notify the owner when a new NeoMusicBot release is detected. This never updates
// the running release or downloads an executable.
updatealerts = true

// off, error, warn, info, debug, trace, or all.
loglevel = info

/// END OF NEOMUSICBOT CONFIG ///
