# Modified by Huaaudio for independent Bilibili/Discord development (2026).
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:25.0
    resource_class: medium
    working_directory: ~/repo
    environment:
      MAVEN_OPTS: -Xmx3200m
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-maven-{{ checksum "pom.xml" }}
            - v2-maven-
      - run:
          name: Resolve dependencies
          command: sh ./mvnw --batch-mode --no-transfer-progress -Pnative-linux-x86-64 dependency:go-offline
      - save_cache:
          paths:
            - ~/.m2
          key: v2-maven-{{ checksum "pom.xml" }}
      - run:
          name: Build, test, and generate SBOM
          command: sh ./mvnw --batch-mode --no-transfer-progress -Pnative-linux-x86-64 clean verify
      - store_artifacts:
          path: target

workflows:
  build:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - gh-pages
                - gh-pages-generated
