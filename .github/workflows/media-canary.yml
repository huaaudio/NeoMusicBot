name: Media Resolver Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: media-resolver-canary
  cancel-in-progress: false

env:
  DENO_VERSION: "2.9.7"
  DENO_ASSET: deno-x86_64-unknown-linux-gnu.zip
  DENO_SHA256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
  POT_PROVIDER_VERSION: "2.0.0"
  POT_PROVIDER_COMMIT: 37169ee2656e08c5c2e5dc9df4c598c0cb4c88a8
  POT_PROVIDER_PLUGIN_SHA256: bce874dfa25896c2798e0f4f8147b7b22e785479eb1e459ab232bf2506c95016

jobs:
  canary:
    name: yt-dlp ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: latest stable
            repository: yt-dlp/yt-dlp
            artifact_suffix: stable
          - channel: latest nightly
            repository: yt-dlp/yt-dlp-nightly-builds
            artifact_suffix: nightly

    steps:
      - name: Checkout canary definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test immutable yt-dlp candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          YTDLP_CHANNEL: ${{ matrix.channel }}
          YTDLP_REPOSITORY: ${{ matrix.repository }}
        run: bash scripts/ci/media_canary.sh

      - name: Upload sanitized immutable candidate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-canary-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 30
          path: reports/candidate.txt
