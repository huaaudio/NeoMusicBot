name: Media Resolver Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: media-resolver-canary
  cancel-in-progress: false

env:
  DENO_VERSION: "2.9.3"
  DENO_ASSET: deno-x86_64-unknown-linux-gnu.zip
  DENO_SHA256: 8101865641cbede56f08ad19c0a67a87df84bce127fee0d3e3e1f7467717ffa6
  POT_PROVIDER_VERSION: "1.3.1"
  POT_PROVIDER_COMMIT: 7608dd51ee813b48cf9a6d68c6e42cb197ce10e0
  POT_PROVIDER_PLUGIN_SHA256: b8ceec7f76143da172aaf5ebeec0c2d218e5680c063b931586bca48567069b38

jobs:
  canary:
    name: yt-dlp ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - channel: latest stable
            repository: yt-dlp/yt-dlp
            artifact_suffix: stable
          - channel: latest nightly
            repository: yt-dlp/yt-dlp-nightly-builds
            artifact_suffix: nightly

    steps:
      - name: Checkout canary definitions
        uses: actions/checkout@v4

      - name: Test immutable yt-dlp candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          YTDLP_CHANNEL: ${{ matrix.channel }}
          YTDLP_REPOSITORY: ${{ matrix.repository }}
        run: bash scripts/ci/media_canary.sh

      - name: Upload sanitized immutable candidate report
        uses: actions/upload-artifact@v4
        with:
          name: media-canary-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 30
          path: reports/candidate.txt
