# Modified by Huaaudio for independent Bilibili/Discord development (2026).
name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      media_runner:
        description: "Optional unique label of an isolated one-job Linux x86-64 media runner"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  YTDLP_VERSION: "2026.08.19"
  DENO_VERSION: "2.9.7"
  POT_PROVIDER_VERSION: "2.0.0"
  POT_PROVIDER_COMMIT: "37169ee2656e08c5c2e5dc9df4c598c0cb4c88a8"
  POT_PROVIDER_PLUGIN_SHA256: "bce874dfa25896c2798e0f4f8147b7b22e785479eb1e459ab232bf2506c95016"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            profile: native-linux-x86-64
            artifact_suffix: linux-x86-64
            ytdlp_asset: yt-dlp_linux
            ytdlp_sha256: 58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a
            deno_asset: deno-x86_64-unknown-linux-gnu.zip
            deno_sha256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
          - name: Windows x86-64
            os: windows-latest
            profile: native-windows-x86-64
            artifact_suffix: windows-x86-64
            ytdlp_asset: yt-dlp.exe
            ytdlp_sha256: 66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a
            deno_asset: deno-x86_64-pc-windows-msvc.zip
            deno_sha256: a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin
          check-latest: true
          cache: maven

      - name: Test CI diagnostics and package validators
        run: python -m unittest discover -s scripts/ci -p "test_*.py"

      - name: Build, test, and generate SBOM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sh ./mvnw --batch-mode --no-transfer-progress -P${{ matrix.profile }} clean verify

      - name: Build, test, and generate SBOM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress -P${{ matrix.profile }} clean verify

      - name: Verify upstream license and notice preservation
        shell: bash
        run: |
          python scripts/ci/verify_licenses.py target/generated-resources/dependency-licenses target/bom.json
          python scripts/ci/verify_shaded_notices.py target/NeoMusicBot-*-${{ matrix.artifact_suffix }}.jar target/bom.json target/surefire-reports

      - name: Assemble and verify Linux release bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          YTDLP_ASSET: ${{ matrix.ytdlp_asset }}
          YTDLP_SHA256: ${{ matrix.ytdlp_sha256 }}
          DENO_ASSET: ${{ matrix.deno_asset }}
          DENO_SHA256: ${{ matrix.deno_sha256 }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: bash scripts/ci/assemble_linux.sh

      - name: Assemble and verify Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YTDLP_ASSET: ${{ matrix.ytdlp_asset }}
          YTDLP_SHA256: ${{ matrix.ytdlp_sha256 }}
          DENO_ASSET: ${{ matrix.deno_asset }}
          DENO_SHA256: ${{ matrix.deno_sha256 }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: .\scripts\ci\assemble_windows.ps1

      - name: Verify platform evidence used by the prerelease gate
        run: python scripts/ci/prepare_prerelease.py platform target ${{ matrix.artifact_suffix }}

      - name: Upload tested platform bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeoMusicBot-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            target/NeoMusicBot-${{ matrix.artifact_suffix }}.zip
            target/NeoMusicBot-${{ matrix.artifact_suffix }}.zip.sha256
            target/bom.json
            target/bom.xml
            target/bundle-verification.txt

  modern_java:
    name: Java 27 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: oracle-openjdk
          java-version: "27"
          cache: maven
      - name: Test latest stable Java, including JDAVE native loading
        shell: bash
        run: sh ./mvnw --batch-mode --no-transfer-progress test

  locked_media_canary:
    name: Locked media resolver canary
    needs: build
    # Only an explicit dispatch of the default branch can select a private label.
    # Pushes, pull requests and dispatches of other branches keep the hosted runner.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.media_runner != '' && inputs.media_runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      YTDLP_REPOSITORY: yt-dlp/yt-dlp
      YTDLP_ASSET: yt-dlp_linux
      YTDLP_SHA256: 58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a
      DENO_ASSET: deno-x86_64-unknown-linux-gnu.zip
      DENO_SHA256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490

    steps:
      - name: Checkout locked canary definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the exact release media toolchain
        shell: bash
        run: bash scripts/ci/media_canary.sh

      - name: Upload sanitized locked media canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeoMusicBot-media-canary
          if-no-files-found: error
          retention-days: 14
          path: reports/candidate.txt
