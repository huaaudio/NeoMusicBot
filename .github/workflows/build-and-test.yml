# Modified by Huaaudio for independent Bilibili/Discord development (2026).
name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  YTDLP_VERSION: "2026.07.04"
  DENO_VERSION: "2.9.3"
  POT_PROVIDER_VERSION: "1.3.1"
  POT_PROVIDER_COMMIT: "7608dd51ee813b48cf9a6d68c6e42cb197ce10e0"
  POT_PROVIDER_PLUGIN_SHA256: "b8ceec7f76143da172aaf5ebeec0c2d218e5680c063b931586bca48567069b38"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            profile: native-linux-x86-64
            artifact_suffix: linux-x86-64
            ytdlp_asset: yt-dlp
            ytdlp_sha256: 495be29ff4d9d4e9be7eabdfef225221e5d5282e77f2f505abc6dca80349f3fd
            deno_asset: deno-x86_64-unknown-linux-gnu.zip
            deno_sha256: 8101865641cbede56f08ad19c0a67a87df84bce127fee0d3e3e1f7467717ffa6
          - name: Windows x86-64
            os: windows-latest
            profile: native-windows-x86-64
            artifact_suffix: windows-x86-64
            ytdlp_asset: yt-dlp.exe
            ytdlp_sha256: 52fe3c26dcf71fbdc85b528589020bb0b8e383155cfa81b64dd447bbe35e24b8
            deno_asset: deno-x86_64-pc-windows-msvc.zip
            deno_sha256: 60343461ac5fe3a31f4ef12667f2946bb852e20655c8610aeb7e751e87f7df3a
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build, test, and generate SBOM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sh ./mvnw --batch-mode --no-transfer-progress -P${{ matrix.profile }} clean verify

      - name: Build, test, and generate SBOM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress -P${{ matrix.profile }} clean verify

      - name: Assemble and verify Linux release bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          YTDLP_ASSET: ${{ matrix.ytdlp_asset }}
          YTDLP_SHA256: ${{ matrix.ytdlp_sha256 }}
          DENO_ASSET: ${{ matrix.deno_asset }}
          DENO_SHA256: ${{ matrix.deno_sha256 }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: bash scripts/ci/assemble_linux.sh

      - name: Assemble and verify Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YTDLP_ASSET: ${{ matrix.ytdlp_asset }}
          YTDLP_SHA256: ${{ matrix.ytdlp_sha256 }}
          DENO_ASSET: ${{ matrix.deno_asset }}
          DENO_SHA256: ${{ matrix.deno_sha256 }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: .\scripts\ci\assemble_windows.ps1

      - name: Upload tested platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: NeoMusicBot-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            target/NeoMusicBot-${{ matrix.artifact_suffix }}.zip
            target/NeoMusicBot-${{ matrix.artifact_suffix }}.zip.sha256
            target/bom.json
            target/bom.xml

  locked_media_canary:
    name: Locked media resolver canary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YTDLP_REPOSITORY: yt-dlp/yt-dlp
      YTDLP_ASSET: yt-dlp
      YTDLP_SHA256: 495be29ff4d9d4e9be7eabdfef225221e5d5282e77f2f505abc6dca80349f3fd
      DENO_ASSET: deno-x86_64-unknown-linux-gnu.zip
      DENO_SHA256: 8101865641cbede56f08ad19c0a67a87df84bce127fee0d3e3e1f7467717ffa6

    steps:
      - name: Checkout locked canary definitions
        uses: actions/checkout@v4

      - name: Test the exact release media toolchain
        shell: bash
        run: bash scripts/ci/media_canary.sh

      - name: Upload sanitized locked media canary report
        uses: actions/upload-artifact@v4
        with:
          name: NeoMusicBot-media-canary
          if-no-files-found: error
          retention-days: 14
          path: reports/candidate.txt
