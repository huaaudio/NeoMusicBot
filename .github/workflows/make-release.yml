# Modified by Huaaudio for independent Bilibili/Discord development (2026).
name: Make Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build and Test workflow run ID
        required: true
        type: string
      version_number:
        description: Version number or tag, using only letters, digits, dot, underscore, and dash
        required: true
        type: string
      info:
        description: Release notes
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  create_release:
    name: Release previously tested platform ZIPs
    runs-on: ubuntu-latest
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      VERSION_NUMBER: ${{ inputs.version_number }}
      YTDLP_VERSION: "2026.08.19"
      YTDLP_SHA256: 58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a
      DENO_VERSION: "2.9.7"
      DENO_SHA256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
      POT_PROVIDER_VERSION: "2.0.0"
      POT_PROVIDER_COMMIT: 37169ee2656e08c5c2e5dc9df4c598c0cb4c88a8
      POT_PROVIDER_PLUGIN_SHA256: bce874dfa25896c2798e0f4f8147b7b22e785479eb1e459ab232bf2506c95016

    steps:
      - name: Validate source workflow run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${VERSION_NUMBER}" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid version number" >&2
              exit 2
              ;;
          esac
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" --jq .conclusion)"
          workflow_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" --jq .name)"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" --jq .head_sha)"
          test "${conclusion}" = "success"
          test "${workflow_name}" = "Build and Test"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download tested platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: NeoMusicBot-*
          path: artifacts

      - name: Verify and collect immutable release files
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir dist
          for platform in linux-x86-64 windows-x86-64; do
            artifact_dir="artifacts/NeoMusicBot-${platform}"
            (
              cd "${artifact_dir}"
              sha256sum --check "NeoMusicBot-${platform}.zip.sha256"
            )
            cp -- "${artifact_dir}/NeoMusicBot-${platform}.zip" dist/
            cp -- "${artifact_dir}/bom.json" "dist/NeoMusicBot-${platform}.cdx.json"
            cp -- "${artifact_dir}/bom.xml" "dist/NeoMusicBot-${platform}.cdx.xml"
          done

          candidate="artifacts/NeoMusicBot-media-canary/candidate.txt"
          test -f "${candidate}"
          require_line() {
            grep -Fqx -- "$1" "${candidate}"
          }
          require_line "mode=locked"
          require_line "repository=yt-dlp/yt-dlp"
          require_line "release.tag=${YTDLP_VERSION}"
          require_line "neomusicbot.commit=${SOURCE_SHA}"
          require_line "yt-dlp.version=${YTDLP_VERSION}"
          require_line "yt-dlp.sha256=${YTDLP_SHA256}"
          require_line "deno.version=${DENO_VERSION}"
          require_line "deno.sha256=${DENO_SHA256}"
          require_line "bgutil-provider.version=${POT_PROVIDER_VERSION}"
          require_line "bgutil-provider.commit=${POT_PROVIDER_COMMIT}"
          require_line "bgutil-provider.plugin.sha256=${POT_PROVIDER_PLUGIN_SHA256}"
          require_line "youtube.anonymous=passed"
          require_line "youtube.mweb-provider=passed"
          require_line "bilibili.anonymous=passed"
          cp -- "${candidate}" dist/NeoMusicBot-media-canary.txt

          (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ inputs.version_number }}
          name: Version ${{ inputs.version_number }}
          target_commitish: ${{ steps.source.outputs.head_sha }}
          draft: true
          prerelease: false
          body: ${{ inputs.info }}
          files: dist/*
          fail_on_unmatched_files: true
