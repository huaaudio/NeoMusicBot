# Modified by Huaaudio for independent Bilibili/Discord development (2026).
name: Make Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build and Test run for this exact default-branch commit
        required: true
        type: string
      version_number:
        description: Prerelease tag matching pom.xml, for example v0.5.0-beta.1
        required: true
        type: string
      info:
        description: Release notes including migration, test coverage, and known limitations
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: neomusicbot-prerelease
  cancel-in-progress: false

jobs:
  create_release:
    name: Publish verified prerelease assets
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      VERSION_NUMBER: ${{ inputs.version_number }}

    steps:
      - name: Checkout publishing commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate successful source workflow and prerelease version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" > source-run.json
          gh api "repos/${GITHUB_REPOSITORY}" > repository.json
          python scripts/ci/prepare_prerelease.py source source-run.json repository.json

      - name: Download tested platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: NeoMusicBot-*
          path: artifacts

      - name: Verify commit, versions, bundle reports, SBOMs, tools, and media evidence
        shell: bash
        run: python scripts/ci/prepare_prerelease.py prepare artifacts dist

      - name: Create new tag and upload a prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.info }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os; from pathlib import Path; Path("release-notes.md").write_text(os.environ["RELEASE_NOTES"], encoding="utf-8")'
          # Creating the ref fails atomically if it already exists. Never move a tag
          # or overwrite a previous release, including a failed publication draft.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION_NUMBER}" -f "sha=${GITHUB_SHA}" > tag-ref.json
          gh release create "${VERSION_NUMBER}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --draft --prerelease --latest=false \
            --title "NeoMusicBot ${VERSION_NUMBER}" --notes-file release-notes.md
          release_id="$(gh release view "${VERSION_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)"
          [[ "${release_id}" =~ ^[1-9][0-9]*$ ]]
          printf 'RELEASE_ID=%s\n' "${release_id}" >> "${GITHUB_ENV}"

      - name: Download draft assets and compare every uploaded byte hash
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > draft-release.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION_NUMBER}" > tag-ref.json
          python scripts/ci/prepare_prerelease.py draft draft-release.json tag-ref.json
          gh release download "${VERSION_NUMBER}" --repo "${GITHUB_REPOSITORY}" --pattern '*' --dir downloaded
          python scripts/ci/prepare_prerelease.py download dist downloaded

      - name: Publish only as a prerelease and verify the published state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${VERSION_NUMBER}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease --latest=false
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > published-release.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION_NUMBER}" > tag-ref.json
          python scripts/ci/prepare_prerelease.py published published-release.json tag-ref.json
          gh release download "${VERSION_NUMBER}" --repo "${GITHUB_REPOSITORY}" --pattern '*' --dir published-assets
          python scripts/ci/prepare_prerelease.py download dist published-assets
          printf 'Published verified prerelease: https://github.com/%s/releases/tag/%s\n' "${GITHUB_REPOSITORY}" "${VERSION_NUMBER}" >> "${GITHUB_STEP_SUMMARY}"
